# Every tunable value of the Republic.
#
# Nothing here is code. Changing a value here changes what the tools do, which
# is why it is governed: art-01/§4/¶3 keeps rates and thresholds out of the
# Constitution, and a measure of class "parameter" is how they move.
#
# tools/gate.js requires an organic measure for any change to this file, and
# nothing else in the repository may hardcode a value that appears here.

version: 1

governance:
  classes:
    ordinary:
      label: Ordinary measure
      quorum: 0.20
      threshold: 0.50
      window_days: 7
    policy:
      label: Policy
      quorum: 0.20
      threshold: 0.50
      window_days: 7
    organic:
      label: Organic statute
      quorum: 0.33
      threshold: 0.6667
      window_days: 14
    amendment:
      label: Constitutional amendment
      quorum: 0.50
      threshold: 0.6667
      window_days: 21
      successive: true
      successive_days: 30
    entrenched:
      label: Entrenched provision
      quorum: 0.60
      threshold: 0.75
      window_days: 30
      successive: true
      successive_days: 30
    election:
      label: Election
      quorum: 0.33
      method: irv
      window_days: 7

ballot:
  # art-08/§43 — one ballot per citizenship. A later ballot replaces an earlier
  # one; an earlier one may never replace a later one.
  one_per_citizenship: true
  allow_update: true
  reject_after_close: true

  # art-08/§43/¶5 — voting closes when waiting can no longer change anything.
  early_close:
    enabled: true
    # every citizenship on the register has voted (art-08/§43/¶6, first limb)
    on_full_participation: true
    # no distribution of the remaining ballots could change the result
    # (art-08/§43/¶6, second and third limbs)
    on_determined_outcome: true
    # a floor, as a fraction of the electorate, before either applies at all
    minimum_participation: 1.0

admission:
  minimum_age: 16
  objection_days: 7

value:
  unit: obol
  subunit: mina
  issue_cap_per_resolution: 100000

journal:
  auto_publish_on_enactment: true
