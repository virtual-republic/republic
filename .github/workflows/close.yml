# art-08/§43/¶5 — voting closes at the earlier of the end of the period, or the
# moment the outcome can no longer change.
# art-08/§45/¶1 — a measure that carries is enacted by publication.
#
# Runs daily, and on demand from the website's "Close and enact" button. Counts
# every measure that is due, publishes the Journal issue for those that carried,
# and opens a pull request with the lot.
name: close

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      measure:
        description: 'Measure to close, e.g. P-0001. Leave blank for everything due.'
        required: false

jobs:
  close:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: What is due?
        run: node tools/close.js ${{ inputs.measure }} --dry-run | tee due.txt

      - name: Close and enact
        run: node tools/close.js ${{ inputs.measure }} | tee close.txt

      - name: Verify the register still verifies
        run: node tools/verify.js && node tools/test.js

      - name: Propose the result
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if git diff --quiet; then echo "nothing changed"; exit 0; fi
          BR="close/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name  "Keeper of the Journal"
          git config user.email "keeper@users.noreply.github.com"
          git checkout -b "$BR"
          git add ballots/ journal/ ledger/
          git commit -m "close and enact (art-08/§43/¶5, art-08/§45/¶1)"
          git push -u origin "$BR"
          gh pr create --title "Close and enact" --body-file close.txt --base "${{ github.event.repository.default_branch }}" \
            || echo "::warning::Actions cannot open pull requests here. The branch is pushed; open it at https://github.com/$GITHUB_REPOSITORY/pull/new/$BR"

      - if: always()
        run: cat close.txt >> $GITHUB_STEP_SUMMARY || true
