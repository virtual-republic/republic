# art-08/§42/¶2 — the record of deliberation is published with the proposal.
#
# Discussion happens in GitHub Discussions, which are not in the repository.
# This archives them so the record survives the platform.
name: Archive deliberation
on:
  schedule: [{ cron: '0 2 * * *' }]
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions: { contents: write, discussions: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: node tools/archive-deliberation.js
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "Keeper of the Journal"
          git config user.email "keeper@users.noreply.github.com"
          BR="deliberation/$(date -u +%Y-%m-%d)"
          git checkout -b "$BR"
          git add proposals/
          git diff --cached --quiet && exit 0
          git commit -m "archive deliberation (art-08/§42/¶2)"
          git push -u origin "$BR"
          gh pr create --fill --base "${{ github.event.repository.default_branch }}"  \
            || echo "::warning::Actions cannot open pull requests here. The branch is pushed; open it at https://github.com/$GITHUB_REPOSITORY/pull/new/$BR"