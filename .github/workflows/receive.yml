# art-08/§41 — a proposal that does not cite a resolvable provision is not received.
# This workflow is that provision, executing. It is public, versioned, and
# amendable only by the procedure in art-11.
name: Receive proposal
on:
  pull_request:
    paths: ['proposals/**']

jobs:
  receive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Validate every changed proposal
        run: |
          set -e
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'proposals/*.md' | grep -v TEMPLATE || true)
          if [ -z "$FILES" ]; then echo "no proposals changed"; exit 0; fi
          for f in $FILES; do
            echo "::group::$f"
            node tools/validate.js "$f"
            echo "::endgroup::"
          done
