# art-08/§43/¶5 — voting closes at the earlier of the end of the period, or the
# moment the outcome can no longer change.
# art-08/§45/¶1 — a measure that carries is enacted by publication.
#
# A measure that has reached its quorum and can no longer move is decided. There
# is nothing left to deliberate, so this records the result directly rather than
# waiting on anyone to merge it. Everything it writes — ballots, ledger, journal,
# statutes, offices — is a record, and tools/gate.js exempts records from the
# vote requirement precisely so that procedure can complete itself.
name: close

on:
  push:
    branches: [main]
    paths: ['ballots/**']          # a ballot may be the one that decides it
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      measure:
        description: 'Measure to close, e.g. P-0001. Leave blank for everything due.'
        required: false

concurrency:
  group: close
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: What is due?
        run: node tools/close.js ${{ inputs.measure }} --dry-run | tee due.txt

      - name: Close and enact
        run: node tools/close.js ${{ inputs.measure }} | tee close.txt

      - name: The register must still verify
        run: node tools/verify.js && node tools/test.js

      - name: Record it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "nothing to record"; exit 0; fi
          git config user.name  "Keeper of the Journal"
          git config user.email "keeper@users.noreply.github.com"
          git add ballots/ ledger/ journal/ register/ statutes/ 2>/dev/null || true
          git commit -m "close and enact (art-08/§43/¶5, art-08/§45/¶1)"

          # Records are exempt from the gate, so they go straight to main. If the
          # branch is protected against even this, fall back to a pull request
          # rather than losing the work.
          if git push origin HEAD:main; then
            echo "recorded on main"
          else
            BR="close/$(date -u +%Y-%m-%d-%H%M)"
            git branch "$BR" && git push -u origin "$BR"
            gh pr create --title "Close and enact" --body-file close.txt --base main \
              && gh pr merge "$BR" --squash --admin \
              || echo "::warning::Could not record automatically. Open https://github.com/$GITHUB_REPOSITORY/pull/new/$BR"
          fi

      - if: always()
        run: cat close.txt >> $GITHUB_STEP_SUMMARY || true

  publish:
    needs: close
    if: always()
    permissions: { contents: read, pages: write, id-token: write }
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: BASE_PATH=${{ vars.BASE_PATH }} node tools/build.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
